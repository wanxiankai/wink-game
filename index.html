<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f0d8" />
    <title>眨眼拍苍蝇</title>
  </head>
  <body>
    <div id="app">
      <video id="camera" playsinline muted></video>
      <canvas id="background"></canvas>
      <canvas id="flies3d"></canvas>
      <canvas id="game"></canvas>

      <section id="menu" class="screen screen--active">
        <div class="brand">
          <span class="brand__mark">啪</span>
          <div>
            <p class="eyebrow">Blink Swat</p>
            <h1>眨眼拍苍蝇</h1>
          </div>
        </div>
        <p class="lead">移动头部瞄准，眨眼挥拍。摄像头画面只在本机处理。</p>
        <div class="menu-actions">
          <button id="startButton" class="primary">开始游戏</button>
          <button id="touchModeButton" class="secondary">触摸模式</button>
        </div>
      </section>

      <section id="tutorial" class="screen">
        <div class="status-line" id="trackingStatus">正在初始化摄像头...</div>
        <div class="tutorial-step" id="tutorialStep">请将眼睛对准摄像头</div>
        <button id="skipTutorialButton" class="secondary">直接开局</button>
      </section>

      <section id="hud" class="hud" aria-live="polite">
        <div>
          <span>得分</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span>连击</span>
          <strong id="combo">x0</strong>
        </div>
        <div>
          <span>时间</span>
          <strong id="timer">60</strong>
        </div>
        <label class="camera-toggle" for="backgroundToggle">
          <span>实时背景</span>
          <input id="backgroundToggle" type="checkbox" />
          <i aria-hidden="true"></i>
        </label>
      </section>

      <section id="gameover" class="screen">
        <div class="result-badge" id="rank">C</div>
        <h2>本局结束</h2>
        <p id="finalScore" class="lead">0 分</p>
        <div class="menu-actions">
          <button id="restartButton" class="primary">再来一局</button>
          <button id="homeButton" class="secondary">返回首页</button>
        </div>
      </section>

      <div id="orientationHint">请竖屏游玩</div>
      <div id="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
